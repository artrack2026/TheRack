<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wallbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8078"/>
      <stop offset="30%" stop-color="#c8beb0"/>
      <stop offset="70%" stop-color="#7a7068"/>
      <stop offset="100%" stop-color="#4a4038"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8d8e8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#88a8c0" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wallbg)"/>
  <!-- wall texture lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#252015" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#252015" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#252015" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#252015" stroke-width="1" opacity="0.5"/>
  <!-- outer steel frame -->
  <rect x="80" y="30" width="440" height="340" fill="none" stroke="url(#steel)" stroke-width="14" rx="2"/>
  <!-- horizontal dividers -->
  <line x1="80" y1="143" x2="520" y2="143" stroke="url(#steel)" stroke-width="8"/>
  <line x1="80" y1="257" x2="520" y2="257" stroke="url(#steel)" stroke-width="8"/>
  <!-- vertical dividers -->
  <line x1="227" y1="30" x2="227" y2="370" stroke="url(#steel)" stroke-width="8"/>
  <line x1="373" y1="30" x2="373" y2="370" stroke="url(#steel)" stroke-width="8"/>
  <!-- glass panes -->
  <rect x="87" y="37" width="133" height="99" fill="url(#glass)"/>
  <rect x="234" y="37" width="132" height="99" fill="url(#glass)" opacity="0.8"/>
  <rect x="380" y="37" width="133" height="99" fill="url(#glass)" opacity="1.2"/>
  <rect x="87" y="150" width="133" height="100" fill="url(#glass)" opacity="1.1"/>
  <rect x="234" y="150" width="132" height="100" fill="url(#glass)" opacity="0.6"/>
  <rect x="380" y="150" width="133" height="100" fill="url(#glass)" opacity="0.9"/>
  <rect x="87" y="264" width="133" height="99" fill="url(#glass)" opacity="0.7"/>
  <rect x="234" y="264" width="132" height="99" fill="url(#glass)"/>
  <rect x="380" y="264" width="133" height="99" fill="url(#glass)" opacity="1.1"/>
  <!-- paint chips/patina on frame -->
  <rect x="95" y="38" width="12" height="4" fill="#4a5a3a" opacity="0.6" rx="1"/>
  <rect x="290" y="260" width="8" height="3" fill="#3a4a2a" opacity="0.5" rx="1"/>
  <rect x="450" y="145" width="10" height="3" fill="#5a4a2a" opacity="0.4" rx="1"/>
  <text x="300" y="392" font-family="sans-serif" font-size="10" fill="#8a7860" opacity="0.7" text-anchor="middle">ca. 1940s · Salvaged Steel</text>
</svg>
