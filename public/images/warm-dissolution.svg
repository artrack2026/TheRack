<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="bg" cx="40%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#c8602a"/>
      <stop offset="45%" stop-color="#8b3a1a"/>
      <stop offset="100%" stop-color="#2a1a0e"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- abstract warm blobs -->
  <ellipse cx="180" cy="200" rx="200" ry="140" fill="#d4813a" opacity="0.55" filter="url(#blur1)"/>
  <ellipse cx="420" cy="150" rx="160" ry="120" fill="#e8a030" opacity="0.45" filter="url(#blur1)"/>
  <ellipse cx="500" cy="300" rx="130" ry="100" fill="#b05020" opacity="0.6" filter="url(#blur2)"/>
  <ellipse cx="100" cy="320" rx="120" ry="80" fill="#f0c060" opacity="0.3" filter="url(#blur2)"/>
  <!-- raw edge texture marks -->
  <path d="M0,380 Q150,340 300,370 Q450,400 600,360 L600,400 L0,400Z" fill="#1a0e06" opacity="0.7"/>
  <path d="M0,0 Q80,20 160,8 Q240,0 320,15 Q400,30 480,10 Q540,0 600,18 L600,0Z" fill="#1a0e06" opacity="0.5"/>
  <!-- linen texture suggestion -->
  <rect width="600" height="400" fill="url(#bg)" opacity="0.08" filter="url(#grain)"/>
  <!-- signature mark -->
  <text x="555" y="388" font-family="serif" font-size="11" fill="#f0c060" opacity="0.6" text-anchor="end">WD No.3</text>
</svg>
