<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="paperbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
  </defs>
  <!-- paper background -->
  <rect width="600" height="400" fill="#1c1c1a"/>
  <!-- three prints laid out -->
  <!-- Print 1 -->
  <rect x="30" y="40" width="165" height="210" fill="url(#paperbg)" rx="2"/>
  <rect x="35" y="45" width="155" height="200" fill="#f0ead8" rx="1"/>
  <!-- botanical stem -->
  <line x1="112" y1="230" x2="112" y2="120" stroke="#4a6a38" stroke-width="2"/>
  <ellipse cx="112" cy="115" rx="22" ry="30" fill="#5a8040" opacity="0.85" transform="rotate(-10,112,115)"/>
  <ellipse cx="90" cy="155" rx="18" ry="24" fill="#6a9048" opacity="0.8" transform="rotate(20,90,155)"/>
  <ellipse cx="134" cy="145" rx="16" ry="22" fill="#4a7030" opacity="0.75" transform="rotate(-15,134,145)"/>
  <ellipse cx="98" cy="185" rx="14" ry="18" fill="#5a8038" opacity="0.7" transform="rotate(25,98,185)"/>
  <text x="112" y="258" font-family="serif" font-size="9" fill="#6a5a40" text-anchor="middle" font-style="italic">Ficus lyrata</text>

  <!-- Print 2 -->
  <rect x="215" y="40" width="165" height="210" fill="url(#paperbg)" rx="2"/>
  <rect x="220" y="45" width="155" height="200" fill="#f0ead8" rx="1"/>
  <!-- flower -->
  <circle cx="298" cy="145" r="15" fill="#d4a030"/>
  <ellipse cx="298" cy="108" rx="12" ry="22" fill="#e8b840" opacity="0.85"/>
  <ellipse cx="298" cy="182" rx="12" ry="22" fill="#e8b840" opacity="0.85"/>
  <ellipse cx="261" cy="145" rx="22" ry="12" fill="#e8b840" opacity="0.8"/>
  <ellipse cx="335" cy="145" rx="22" ry="12" fill="#e8b840" opacity="0.8"/>
  <ellipse cx="272" cy="116" rx="14" ry="20" fill="#d4a030" opacity="0.7" transform="rotate(-45,272,116)"/>
  <ellipse cx="324" cy="116" rx="14" ry="20" fill="#d4a030" opacity="0.7" transform="rotate(45,324,116)"/>
  <ellipse cx="272" cy="174" rx="14" ry="20" fill="#d4a030" opacity="0.7" transform="rotate(45,272,174)"/>
  <ellipse cx="324" cy="174" rx="14" ry="20" fill="#d4a030" opacity="0.7" transform="rotate(-45,324,174)"/>
  <line x1="298" y1="230" x2="298" y2="200" stroke="#4a6a38" stroke-width="2"/>
  <text x="298" y="258" font-family="serif" font-size="9" fill="#6a5a40" text-anchor="middle" font-style="italic">Helianthus annuus</text>

  <!-- Print 3 -->
  <rect x="400" y="40" width="165" height="210" fill="url(#paperbg)" rx="2"/>
  <rect x="405" y="45" width="155" height="200" fill="#f0ead8" rx="1"/>
  <!-- fern -->
  <line x1="482" y1="235" x2="482" y2="140" stroke="#3a5a2a" stroke-width="2"/>
  <path d="M482,200 Q460,185 445,175" stroke="#4a6a38" stroke-width="1.5" fill="none"/>
  <ellipse cx="445" cy="173" rx="10" ry="6" fill="#5a8040" opacity="0.75" transform="rotate(-30,445,173)"/>
  <path d="M482,185 Q504,170 519,160" stroke="#4a6a38" stroke-width="1.5" fill="none"/>
  <ellipse cx="519" cy="158" rx="10" ry="6" fill="#5a8040" opacity="0.75" transform="rotate(30,519,158)"/>
  <path d="M482,168 Q460,153 448,140" stroke="#4a6a38" stroke-width="1.5" fill="none"/>
  <ellipse cx="447" cy="138" rx="10" ry="6" fill="#5a8040" opacity="0.7" transform="rotate(-25,447,138)"/>
  <path d="M482,155 Q504,140 515,128" stroke="#4a6a38" stroke-width="1.5" fill="none"/>
  <ellipse cx="515" cy="126" rx="10" ry="6" fill="#5a8040" opacity="0.7" transform="rotate(25,515,126)"/>
  <ellipse cx="482" cy="135" rx="8" ry="14" fill="#6a9048" opacity="0.8"/>
  <text x="482" y="258" font-family="serif" font-size="9" fill="#6a5a40" text-anchor="middle" font-style="italic">Nephrolepis exaltata</text>

  <!-- archival resin gloss suggestion -->
  <rect x="30" y="40" width="165" height="210" fill="white" opacity="0.04" rx="2"/>
  <rect x="215" y="40" width="165" height="210" fill="white" opacity="0.04" rx="2"/>
  <rect x="400" y="40" width="165" height="210" fill="white" opacity="0.04" rx="2"/>

  <text x="300" y="320" font-family="sans-serif" font-size="10" fill="#8a8278" text-anchor="middle">Archival resin · Set of 3 · One-of-a-kind</text>
</svg>
